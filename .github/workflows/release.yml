# Builds and publishes a release when a version tag is pushed:
#
#   1. bump `version` in Cargo.toml and add a section to CHANGELOG.md
#   2. git commit, then:  git tag v1.2.0 && git push origin main v1.2.0
#
# The release gets MadReader-<ver>-setup.exe and MadReader-<ver>-portable.zip,
# with the CHANGELOG section as release notes. Installed copies of Mad Reader
# find it through the GitHub API ("Check for updates") and install the setup.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)build, e.g. v1.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Check that the tag matches Cargo.toml
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          if ("v$v" -ne $env:TAG) { throw "Tag $env:TAG does not match Cargo.toml version $v" }
          "VERSION=$v" | Out-File -Append $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build (tests, exe, zip, installer)
        shell: pwsh
        run: .\build.ps1

      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## $([regex]::Escape($env:VERSION))\b[^\n]*\n(.*?)(?=^## |\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Mad Reader $env:VERSION" }
          $notes | Out-File -Encoding utf8 notes.md

      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = "dist\MadReader-$env:VERSION-setup.exe", "dist\MadReader-$env:VERSION-portable.zip"
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG @files --clobber
          } else {
            gh release create $env:TAG @files --title "Mad Reader $env:VERSION" --notes-file notes.md
          }
